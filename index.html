<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      (function() {
        var h = window.location.hostname.toLowerCase();
        var link = document.querySelector("link[rel*='icon']") || document.createElement('link');
        link.type = 'image/x-icon';
        link.rel = 'shortcut icon';
        if (h.includes('loggi')) {
          link.href = '/loggi-favicon.ico';
          document.title = 'Loggi | Melhores fretes, envios rápidos, entregas em todo Brasil';
        } else if (h.includes('jadlog') || h.includes('jadxlog')) {
          link.href = '/jadlog-favicon.png';
          link.type = 'image/png';
          document.title = 'Jadlog - Sua encomenda no melhor caminho.';
        } else {
          link.href = '/favicon.svg';
        }
        document.getElementsByTagName('head')[0].appendChild(link);
      })();
    </script>
    
    <title>Rastreamento de Encomendas</title>
    <meta name="description" content="Acompanhe o status e a entrega da sua encomenda em tempo real." />
    <meta name="keywords" content="rastreio, correios, rastreamento de encomendas, loggi, jadlog, entrega de encomendas" />
    <meta name="author" content="Rastreamento de Encomendas" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Rastreamento de Encomendas" />
    <meta property="og:description" content="Acompanhe o status e a entrega da sua encomenda em tempo real." />
    <meta property="og:image" content="/og-image.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Rastreamento de Encomendas" />
    <meta name="twitter:description" content="Acompanhe o status e a entrega da sua encomenda em tempo real." />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Rastreio ROI",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "All",
      "description": "Sistema de Rastreamento de Pedidos com Cota Diária e Otimizador de Conversão."
    }
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
